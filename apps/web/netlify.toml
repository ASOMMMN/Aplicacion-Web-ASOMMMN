[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # img-src/frame-src incluyen el host exacto del bucket S3 (nunca un
    # wildcard): las vistas previas embeben la URL firmada de S3 en
    # <iframe>/<img>, y sin este host explícito el navegador las bloquea
    # (se ve como "archivo roto" aunque la firma sea válida).
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://asommmn-reclutamiento.s3.us-east-2.amazonaws.com; frame-src 'self' https://asommmn-reclutamiento.s3.us-east-2.amazonaws.com; font-src 'self' data:; connect-src 'self' https://reclutamiento-asommmn.onrender.com; frame-ancestors 'none';"
